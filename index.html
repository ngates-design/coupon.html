<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="han.png">
    <title>Hannaford - $10 Off Coupon</title>
    <style>
        * {
            box-sizing: border-box;
        }
           
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f3f5f2;
            font-family: Arial, sans-serif;
            color: #23332a;
        }
        {
            body {
                background: #1c1c1c;
                color: #f3f5f2;
            }
            .coupon {
                background: #2c2c2c;
                border-color: #6c9860;
                box-shadow: 0 8px 24px rgb(255 255 255 / 12%);
            }
            .coupon-title {
                color: #ce1b1e;
            }
            .eyebrow, .offer-detail {
                color: #a0a0a0;
            }
        }

title{
    color: #c10a28;
}
        .coupon {
            width: min(100%, 480px);
            color: #ba131e;
            padding: 30px 28px 24px;
            text-align: center;
            background: #fff;
            border: 2px dashed #6c9860;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgb(26 53 31 / 12%);
        }
        .coupon-title {
            margin: 0 0 8px;
            color: #ce1b1e;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo {
            display: inline-block;
            margin: 0;
            color: #28743a;
            font-size: 2rem;
            font-style: italic;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .eyebrow {
            margin: 18px 0 4px;
            color: #58645b;
            font-size: 1rem;
            font-weight: 700;
        }

        .offer {
            margin: 0;
            color: #c62828;
            font-size: clamp(2.5rem, 11vw, 4rem);
            font-weight: 800;
            line-height: 1.05;
        }

        .offer-detail {
            margin: 8px 0 22px;
            color: #58645b;
            font-size: 1rem;
        }

        .coupon img {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    
    <main class="coupon" aria-labelledby="coupon-title">
        <h1 class="logo" id="coupon-title"><header>
        <img src="han.png" alt="image of hannaford logo">
    </header></h1>
        <p class="eyebrow">A thank-you for our loyal customers</p>
        <p class="offer">$10 OFF</p>
        <p class="offer-detail">Enjoy this special coupon!</p>
        <img src="cop.png" alt="Barcode for the Hannaford coupon">
         <hr>
    <footer>
       AHOLD DELHEIZE - ALL RIGHTS RESERVED ©
    </footer>
    </main>
    
   

</body>
</html>
